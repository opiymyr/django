{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>Новая заметка</h1>
    
    <form method="POST" style="background: var(--bg-main); padding: 30px; border-radius: 10px;">
        <div class="form-group">
            <label>Заголовок:</label>
            <input type="text" name="title" placeholder="Название заметки" required>
        </div>
        
        <div class="form-group">
            <label>Содержание:</label>
            <textarea name="content" rows="10" placeholder="Напишите что-нибудь..."></textarea>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('notes') }}" class="btn btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
