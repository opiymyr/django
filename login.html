{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h1>Вход</h1>
    
    <form method="POST">
        <div class="form-group">
            <label>Имя пользователя:</label>
            <input type="text" name="username" placeholder="Введите имя" required>
        </div>
        
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" name="password" placeholder="Введите пароль" required>
        </div>
        
        <button type="submit" class="btn btn-reg" style="width: 100%;">Войти</button>
    </form>
    
    <hr>
    <p style="text-align: center;">Нет аккаунта? <a href="{{ url_for('register') }}" style="color: var(--btn-reg);">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
