{% extends "base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1>Новая задача</h1>
    
    <form method="POST" style="background: var(--bg-main); padding: 30px; border-radius: 10px;">
        <div class="form-group">
            <label>Название задачи:</label>
            <input type="text" name="title" placeholder="Что нужно сделать?" required>
        </div>
        
        <div class="form-group">
            <label>Описание (необязательно):</label>
            <textarea name="description" rows="3" placeholder="Подробнее о задаче..."></textarea>
        </div>
        
        <div class="form-group">
            <label>Дедлайн (когда нужно сделать):</label>
            <input type="date" name="deadline">
        </div>
        
        <div class="form-group">
            <label>Важность:</label>
            <select name="priority">
                <option value="normal">Обычная</option>
                <option value="high">Важная</option>
                <option value="low">Не срочная</option>
            </select>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <button type="submit" class="btn btn-primary">Добавить задачу</button>
            <a href="{{ url_for('tasks') }}" class="btn btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
